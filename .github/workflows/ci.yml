name: CI

# Runs on every pull request and on main. Making this a required check in the
# branch settings is what stops a PR merging red — the workflow only reports.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` already runs `tsc -b`, but doing it on its own first
      # means a type error is reported as a type error rather than as a failed
      # build several minutes later.
      - name: Typecheck
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
